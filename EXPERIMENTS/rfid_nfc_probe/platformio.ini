; Standalone RFID/NFC compatibility probe
; NOT part of SmartSafe production firmware.
; Target: standard ESP32 DevKit (ESP32-WROOM-32) + MFRC522/RC522

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
	-DCORE_DEBUG_LEVEL=0
lib_deps =
	miguelbalboa/MFRC522 @ ^1.4.11
