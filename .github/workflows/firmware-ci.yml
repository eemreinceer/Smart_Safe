name: Firmware CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [esp32cam, esp32cam-hardware]
    defaults:
      run:
        working-directory: FIRMWARE/Platform.IO
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Build ${{ matrix.environment }}
        run: pio run -e "${{ matrix.environment }}"

  repository-security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Reject tracked local secret files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(secrets\.h|\.env|serviceAccountKey\.json)$'; then
            echo "Tracked secret file detected" >&2
            exit 1
          fi
      - name: Reject known credential assignments
        shell: bash
        run: |
          if git grep -nE '(WOKWI_CLI_TOKEN=.{8}|FIREBASE_AUTH_PASSWORD[[:space:]]+"[^"[:space:]]{8,}")' -- ':!*.example.*'; then
            echo "Possible credential assignment detected" >&2
            exit 1
          fi
